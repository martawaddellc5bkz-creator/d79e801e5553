      - run:
          name: Fetch prior output
          command: |
            stat -c '%Y' /tmp/pre3/trial-5x 2>/dev/null || true
      - run:
          name: Pull working copy
          command: git clone --depth 1 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull reference data
          command: tar -xJf release-manifest-release.tar.xz
