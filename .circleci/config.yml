    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dust off the depreciation schedule
          command: |
            mkdir -p /tmp/pre3
            set +o pipefail 2>/dev/null; head -c 1000000 /dev/urandom | xxd -c 16 > /tmp/pre3/trial-5x; true
            echo "stage ok 3"
      - persist_to_workspace:
          root: /tmp/pre3
          paths:
            - 'trial-5x'
